# Continuous integration: vet and test every push and pull request.
name: CI

on:
  push:
  pull_request:

concurrency:
  # Cancel superseded runs on the same branch so every push gets one fresh run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
