# GoReleaser configuration — https://goreleaser.com
#
# Release flow: tag and push, the GitHub Actions workflow in
# .github/workflows/release.yml runs `goreleaser release` for you:
#
#   git tag v1.0.0
#   git push origin v1.0.0
version: 2

project_name: v2pingo

builds:
  - id: v2pingo
    main: ./cmd/v2pingo
    binary: v2pingo
    # Fully static binaries: run anywhere without libc or other dependencies.
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # -trimpath removes local paths from the binary;
    # -s -w strips the symbol table and DWARF data, shrinking it considerably.
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: v2pingo
    # tar.gz everywhere, zip for Windows (explorer-friendly).
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Ship the default subscription list next to the binary so a freshly
    # extracted archive works out of the box: the tool looks for sub-input.txt
    # beside the executable. README and LICENSE are listed explicitly because
    # setting `files` replaces GoReleaser's default (license*/README*) globs.
    files:
      - sub-input.txt
      - README.md
      - LICENSE

checksum:
  # SHA256 sums of every artifact, uploaded as checksums.txt.
  name_template: "checksums.txt"
  # Cover the standalone sub-input.txt release asset too.
  extra_files:
    - glob: sub-input.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
  # Also publish sub-input.txt as a standalone release asset so users can view
  # or download it without unpacking an archive.
  extra_files:
    - glob: sub-input.txt
